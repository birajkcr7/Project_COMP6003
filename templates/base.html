<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}DIMS Dashboard{% endblock %} | Department Information Management</title>
    <!-- Include premium Inter font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Include BoxIcons for beautiful icons -->
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="{% if request.endpoint == 'home' %}home-page{% endif %}">

    <!-- Sidebar Navigation -->
    <nav class="sidebar glass">
        <div class="sidebar-header">
            <h2><i class='bx bxs-graduation'></i> DIMS</h2>
        </div>
        
        <ul class="nav-links">
            <li>
                <a href="{{ url_for('home') }}" class="{% if request.endpoint == 'home' %}active{% endif %}">
                    <i class='bx bx-home'></i>
                    <span>Home</span>
                </a>
            </li>
            <li>
                <a href="{{ url_for('dashboard') }}" class="{% if request.endpoint == 'dashboard' %}active{% endif %}">
                    <i class='bx bx-grid-alt'></i>
                    <span>Dashboard</span>
                </a>
            </li>
            <li>
                <a href="{{ url_for('programs.list_programs') }}" class="{% if 'programs' in request.endpoint %}active{% endif %}">
                    <i class='bx bx-book-bookmark'></i>
                    <span>Programs</span>
                </a>
            </li>
            <li>
                <a href="{{ url_for('courses.search_courses') }}" class="{% if 'courses' in request.endpoint %}active{% endif %}">
                    <i class='bx bx-library'></i>
                    <span>Courses</span>
                </a>
            </li>
            <li>
                <a href="{{ url_for('students.search_students') }}" class="{% if 'students' in request.endpoint %}active{% endif %}">
                    <i class='bx bx-user'></i>
                    <span>Students</span>
                </a>
            </li>
            <li>
                <a href="{{ url_for('classrooms.list_classrooms') }}" class="{% if 'classrooms' in request.endpoint %}active{% endif %}">
                    <i class='bx bx-buildings'></i>
                    <span>Classrooms</span>
                </a>
            </li>
        </ul>
    </nav>

    <!-- Main Content Area -->
    <main class="main-content">
        {% block content %}{% endblock %}
    </main>

</body>
</html>
